name: CI

on:
  push:
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Main Project/requirements.txt"

      - name: Syntax check
        run: python -m compileall "Main Project"

      - name: Import app
        run: |
          python -c "import sys; sys.path.append('Main Project'); import app; print('app import ok')"
